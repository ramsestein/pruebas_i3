# =============================================================================
# harmonize.yaml — Configuración maestra de la Etapa 0
# =============================================================================
# NUNCA hardcodear rutas ni nombres de señales en el código.
# Todos los parámetros vienen de aquí.
# =============================================================================

version: "0.5.0"

# ── Rutas ──────────────────────────────────────────────────────────────────────
paths:
  # Datos crudos de señal (FUERA del repo; sobrescribibles por entorno).
  # El valor admite ${VAR:-default}; ver src/common/paths.py.
  clinic_raw_dir: "${IPROVE3_CLINIC_RAW_DIR:-D:/data/clinic_vitals}"
  vitaldb_raw_dir: "${IPROVE3_VITALDB_RAW_DIR:-D:/data/vitaldb_sicu}"
  # CHARTEVENTS crudo de MIMIC-III (para el builder de casos MIMIC, D6).
  mimic_chartevents_raw: "${IPROVE3_MIMIC_CHARTEVENTS:-D:/data/mimiciii/CHARTEVENTS.csv.gz}"

  # Salidas versionadas de Fase 1 (casos). null = derivar v<version>_<hash>.
  clinic_cases_out: null
  vitaldb_cases_out: null
  mimic_cases_out: null

  # MIMIC-III
  mimic_cases_dir: "datasets/mimic3wdb/mimic_full_cases_enriched"
  mimic_index: "datasets/mimic3wdb/mimic_full_cases_index.json"
  mimic_clinical_dir: "datasets/mimic3wdb/clinical" # ICUSTAYS, PROCEDUREEVENTS_MV, ADMISSIONS, PATIENTS
  mimic_chartevents: "datasets/mimic3wdb/mimic_chartevents_vent.parquet"

  # VitalDB SICU
  vitaldb_cases_dir: "datasets/vitaldb_sicu/vitaldb_full_cases"
  vitaldb_index: "datasets/vitaldb_sicu/vitaldb_full_cases_index.json"

  # Hospital Clínic
  clinic_cases_dir: "datasets/clinic_vitals/clinic_full_cases"
  clinic_index: "datasets/clinic_vitals/clinic_full_cases_index.json"

  # eICU Collaborative
  eicu_dir: "datasets/eicu_collaborative"

  # ZH Dataset
  zh_dir: "datasets/zh_dataset"

  # Output
  output_dir: "datasets/harmonized"

# ── Armonización ───────────────────────────────────────────────────────────────
harmonize:
  target_fs: 125 # Hz — frecuencia de resampleo objetivo
  landmark_delta_min: 30 # Δ entre landmarks (minutos)
  window_length_min: 5 # Longitud de la ventana de agregación (minutos)
  window_mode: "trailing" # "trailing" (termina en landmark) | "centered"
  # Ventanas de fallo para clasificar un intento de extubación como éxito:
  # Si NO hay reintubación dentro de failure_window_hours → éxito
  failure_windows_hours:
    - 48
    - 72
  min_vent_hours: 2 # Mínimo de horas de VM para incluir un caso

# ── Filtros paso-banda (Butterworth, fase cero con sosfiltfilt) ────────────────
filters:
  ECG:
    lowcut_hz: 0.5
    highcut_hz: 40.0
    order: 4
  PPG:
    lowcut_hz: 0.5
    highcut_hz: 8.0
    order: 4
  ABP:
    lowcut_hz: 0.5
    highcut_hz: 20.0
    order: 4

# ── Índices de Calidad de Señal (SQI) ─────────────────────────────────────────
sqi:
  window_sec: 10 # Longitud de la sub-ventana de cálculo SQI (segundos)
  step_sec: 5 # Paso entre sub-ventanas (overlap 50%)
  ECG:
    kurtosis_min: 5.0 # bSQI — kurtosis mínima aceptable
    kurtosis_max: 50.0 # bSQI — kurtosis máxima aceptable
  PPG:
    skewness_min: 0.5 # Skewness mínima (señal PPG debe ser asimétrica)
    perfusion_min: 0.001 # Amplitud relativa mínima (AC/DC)
    template_corr_min: 0.8 # Correlación con template medio
  ABP:
    sys_min_mmhg: 40 # Rango fisiológico sistólica
    sys_max_mmhg: 300
    dia_min_mmhg: 10 # Rango fisiológico diastólica
    dia_max_mmhg: 180
    pulse_pressure_min_mmhg: 5 # Presión de pulso mínima (Sys - Dia)

# ── Mapeo de canales por cohorte (DECLARATIVO) ────────────────────────────────
# null = canal no disponible o nombre aún por confirmar.
# El código nunca asume un nombre; si es null, marca available=False.
channel_maps:
  clinic:
    # Waveforms (alta frecuencia)
    ECG: "Intellivue/ECG_II" # Confirmar: ¿ECG_I o ECG_II?
    PPG: "Intellivue/PLETH"
    ABP: "Intellivue/ART" # Confirmar: ¿ART o ABP?
    # Numéricos
    HR: "Intellivue/ECG_HR" # Confirmar: ECG_HR en lugar de HR
    SBP: "Intellivue/ART_SYS" # Confirmar: ART_SYS en lugar de ABP_SYS
    DBP: "Intellivue/ART_DIA" # Confirmar: ART_DIA en lugar de ABP_DIA
    MAP: "Intellivue/ART_MEAN" # Confirmar: ART_MEAN en lugar de ABP_MEAN
    SpO2: "Intellivue/PLETH_SAT_O2"
    RR: "Intellivue/VENT_RR" # Confirmar: VENT_RR en lugar de RR
    FiO2: "Intellivue/FIO2"
    PEEP: "Intellivue/PEEP_CMH2O"
    TV: "Intellivue/TV_EXP"
    MV: "Intellivue/MV_EXP"
    PIP: "Intellivue/PIP_CMH2O"
    # Outcome variables (disjuntas de features de entrada)
    vasopressor_norepinephrine: null # Rellenar si existe track de dosis NE
    vasopressor_epinephrine: null
    vasopressor_dopamine: null
    lactate: null
    SOFA_respiratory: null
    SOFA_cardiovascular: null
    SOFA_total: null

  vitaldb:
    # Nombres extraídos directamente de los archivos .vital
    # Waveforms
    ECG: "Intellivue/ECG_II" # En VitalDB aparece también ECG_II_WAV, asumimos ECG_II si es el estándar
    PPG: "Intellivue/PLETH"
    ABP: "Intellivue/ABP"
    # Numéricos
    HR: "Intellivue/ECG_HR"
    SBP: "Intellivue/ABP_SYS"
    DBP: "Intellivue/ABP_DIA"
    MAP: "Intellivue/ABP_MEAN"
    SpO2: "Intellivue/PLETH_SAT_O2"
    RR: "Intellivue/RR"
    FiO2: null # No visto en los primeros 10
    PEEP: null # No visto en los primeros 10
    TV: "Intellivue/TV_EXP"
    MV: "Intellivue/MV_EXP"
    PIP: null # No visto en los primeros 10
    # Outcome variables
    vasopressor_norepinephrine: null
    vasopressor_epinephrine: null
    vasopressor_dopamine: null
    lactate: null
    SOFA_respiratory: null
    SOFA_cardiovascular: null
    SOFA_total: null

  mimic:
    # MIMIC no tiene waveforms ECG ni PPG → null por definición
    ECG: null
    PPG: null
    # ABP waveform: solo en el matched-waveform subset (algunos casos)
    ABP: "MIMIC/ART" # Confirmar: ¿ART o ABP según el archivo?
    # Numéricos (tracks enriched de chartevents)
    HR: "MIMIC/HR"
    SBP: "MIMIC/ABP_S"
    DBP: "MIMIC/ABP_D"
    MAP: "MIMIC/ABP_M"
    SpO2: "MIMIC/SpO2"
    RR: "MIMIC/RESP"
    FiO2: "MIMIC/FiO2"
    PEEP: "MIMIC/PEEP"
    TV: "MIMIC/TV"
    MV: "MIMIC/MV"
    PIP: "MIMIC/PIP"
    # Outcome variables — desde chartevents/inputevents_mv
    vasopressor_norepinephrine: null # P12: itemid 221906 en inputevents_mv
    vasopressor_epinephrine: null
    vasopressor_dopamine: null
    lactate: null # P12: itemid 50813 en labevents
    SOFA_respiratory: null
    SOFA_cardiovascular: null
    SOFA_total: null

  eicu:
    # No waveforms
    ECG: null
    PPG: null
    ABP: null
    # Numerics (tracks from vitaldb)
    HR: "eICU/HR"
    SBP: "eICU/ABP_S"
    DBP: "eICU/ABP_D"
    MAP: "eICU/ABP_M"
    SpO2: "eICU/SpO2"
    RR: "eICU/RR_V"
    FiO2: "eICU/FiO2"
    PEEP: "eICU/PEEP"
    TV: "eICU/TV"
    MV: "eICU/MV"
    PIP: "eICU/PIP"
    vasopressor_norepinephrine: "eICU/Norepinephrine"
    vasopressor_epinephrine: "eICU/Epinephrine"
    vasopressor_dopamine: "eICU/Dopamine"
    lactate: "eICU/Lactate"
    SOFA_respiratory: null
    SOFA_cardiovascular: null
    SOFA_total: null

# ── Fuentes de eventos clínicos por cohorte (DECLARATIVO) ────────────────────
# Define cómo detectar t0, extubación, reintubación en cada cohorte.
event_sources:
  clinic:
    # t0 = inicio del archivo .vital
    t0_source: "first_timestamp"
    # Extubación = fin del archivo .vital
    extubation_source: "last_timestamp"
    # Reintubaciones: no hay registradas (100% éxito)
    reintubation_source: null
    reintubation_join_key: null
    death_source: null
    tracheostomy_source: null

  vitaldb:
    # Extracción de t0 (inicio ventilación)
    t0_source: "first_timestamp"

    # Extubaciones y reintubaciones
    extubation_source: "last_timestamp"
    reintubation_source: null
    death_source: null
    tracheostomy_source: null

  mimic:
    # t0 = PROCEDUREEVENTS_MV.starttime donde itemid == 225792
    t0_source: "procedureevents_mv"
    t0_itemid: 225792 # Invasive Mechanical Ventilation
    # Extubación = vent_end del episodio (PROCEDUREEVENTS_MV.endtime)
    # PERO: verificar contra ADMISSIONS.DEATHTIME (P10/P11)
    extubation_source: "procedureevents_mv"
    extubation_itemid: 225792 # endtime del mismo evento
    # Extubaciones explícitas (si existen en PROCEDUREEVENTS_MV)
    explicit_extubation_itemid: null # P10: ¿existe itemid de Extubation?
    # Reintubación = nuevo evento 225792 tras fin del anterior
    reintubation_source: "procedureevents_mv"
    reintubation_itemid: 225792
    # Muerte
    death_source: "admissions" # ADMISSIONS.DEATHTIME
    # Tablas clínicas disponibles (P11)
    requires_admissions_csv: true # ADMISSIONS.csv.gz
    requires_patients_csv: true # PATIENTS.csv.gz

  eicu:
    t0_source: "respiratoryCare"
    extubation_source: "respiratoryCare"
    reintubation_source: "respiratoryCare"
    death_source: "patient"
    tracheostomy_source: null

# ── MIMIC itemids para outcome_variables ───────────────────────────────────────
# (chartevents / inputevents_mv / labevents)
# P12: confirmar que estos archivos están disponibles y los itemids son correctos
mimic_outcome_itemids:
  # Vasopresores (inputevents_mv)
  norepinephrine: [221906]
  epinephrine: [221289]
  dopamine: [221662]
  vasopressin: [222315]
  # Lactato (labevents)
  lactate: [50813]
  # P/F ratio aproximado: PaO2 de labevents
  pao2: [50821]
  # FiO2 para P/F (chartevents)
  fio2_pf: [3420, 223835]

# ── Fase 1.6b: cohorte de eICU y calibración del algoritmo de intervalos ─────
fase1_6b:
  # Cohorte de eICU = escenario e2 con la regla de permeabilidad nueva:
  # un hospital es implausible si >= 50 % de sus estancias con ajustes invasivos
  # NO tienen ni apache_intub (oobIntubDay1) ni cpg_vent (plan de ventilación).
  # No exige densidad rc_invasive/icu. Incluye concentrado_concordantes (259).
  eicu:
    scenario: "e2_permeabilidad_nueva"
    n_hospitals: 53
    hospital_ids:
      [
        63,
        66,
        67,
        71,
        73,
        143,
        146,
        148,
        152,
        154,
        157,
        158,
        165,
        167,
        171,
        175,
        176,
        181,
        194,
        227,
        243,
        244,
        254,
        259,
        264,
        266,
        300,
        301,
        303,
        307,
        310,
        312,
        331,
        336,
        337,
        338,
        345,
        383,
        384,
        386,
        387,
        388,
        389,
        390,
        392,
        394,
        400,
        405,
        419,
        420,
        428,
        458,
        459,
      ]
  # Algoritmo de intervalos de ventilación invasiva a partir de anotaciones:
  # un ajuste abre/mantiene el episodio; un hueco > gap_h lo cierra.
  vent_intervals:
    gap_candidates_h: [2, 4, 6, 8]
    annotation_strata_h: [1, 2, 4] # submuestreo para emular la anotación de eICU
    gap_h: 8 # elegido en MIMIC (ver reports/fase1_6b/calibracion_mimic.md)
  mimic_cases_root: "datasets/mimic3wdb"
  reports_dir: "reports/fase1_6b"

# ── Fase 1.6c: cohortes definitivas antes del dataset final ──────────────────
# D14: eICU estrategia B = hospitales de la cohorte e2 (regla de permeabilidad
# sin densidad) cuyo intervalo MEDIANO de anotación es <= 2 h.
fase1_6c:
  reports_dir: "reports/fase1_6c"
  eicu_b:
    scenario: "e2_permeabilidad_nueva + anotacion_mediana_le_2h"
    n_hospitals: 27
    hospital_ids:
      [
        67,
        148,
        152,
        157,
        171,
        227,
        254,
        259,
        264,
        266,
        301,
        303,
        307,
        312,
        336,
        383,
        384,
        386,
        387,
        388,
        389,
        390,
        392,
        394,
        405,
        458,
        459,
      ]
    max_annotation_median_min: 120
  # D13: inclusión por núcleo mínimo (FC y SpO2 con >= 50 % de horas útiles).
  # `vars_ok` (6 variables) es un INDICADOR de calidad, no un filtro.
  d13:
    core_variables: ["HR", "SpO2"]
    min_coverage: 0.5

# ── Fase 1.6d: cierre definitivo de cohortes ─────────────────────────────────
fase1_6d:
  reports_dir: "reports/fase1_6d"
  # Punto 1: G = 10 h para el algoritmo de intervalos desde anotaciones.
  vent_intervals:
    gap_h: 10
  eicu_b:
    # Mismos 27 hospitales que la 1.6c, reconstruidos con G = 10.
    hospital_ids:
      [
        67,
        148,
        152,
        157,
        171,
        227,
        254,
        259,
        264,
        266,
        301,
        303,
        307,
        312,
        336,
        383,
        384,
        386,
        387,
        388,
        389,
        390,
        392,
        394,
        405,
        458,
        459,
      ]
    max_annotation_median_min: 120
  # Punto 4: variables derivadas de las ondas del ventilador.
  wave_derived:
    fs_hz: 125.0
    # Margen de acuerdo (absoluto; TV relativo) y sesgo máximo admitido.
    agreement_margin: { PIP: 2.0, PEEP: 2.0, RR: 2.0, TV: 0.10 }
    max_abs_bias: { PIP: 1.0, PEEP: 1.0, RR: 1.0, TV: 0.05 }
    min_fraction_within: 0.80
  # Punto 7: particiones propuestas (NO se aplican en la Fase 1.6d).
  partitions:
    mimic_test_fraction: 0.15
    mimic_folds: 5
    eicu_test_hospitals: [67, 171, 227, 301, 303, 336, 392, 405]
    eicu_folds: 5
    clinic_test_fraction: 0.40
    clinic_train_blocks: 2
  # Punto 6: vocabulario único de `end_reason` en las 4 cohortes.
  end_reasons:
    [
      extubation_observed,
      transfer_ventilated,
      death_at_vent,
      terminal_extubation,
      tracheostomy,
      end_of_record,
    ]

# ── Reproducibilidad ──────────────────────────────────────────────────────────
random_seed: 42
log_level: "INFO" # DEBUG | INFO | WARNING | ERROR
